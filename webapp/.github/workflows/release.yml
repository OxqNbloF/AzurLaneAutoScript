name: Build native macOS artifact

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: ditto -c -k --keepParent dist/Alas.app dist/Alas-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Alas-macOS
          path: dist/Alas-macOS.zip
